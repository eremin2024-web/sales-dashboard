<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111417" />
  <title>Агентство Связи — Общие продажи</title>
  <style>
    :root{--bg:#f4f6f5;--card:#fff;--dark:#111417;--text:#171a1d;--muted:#7b8488;--line:#e5e9e7;--accent:#35d6b4;--shadow:0 14px 36px rgba(17,20,23,.06);--radius:20px}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}.shell{width:min(1440px,calc(100% - 48px));margin:0 auto;padding:28px 0 56px}.hero{background:var(--dark);color:#fff;border-radius:28px;padding:34px 36px 30px;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.brand-mark{width:14px;height:14px;border-radius:4px;background:var(--accent);box-shadow:0 0 0 6px rgba(53,214,180,.12);transform:rotate(45deg)}.brand-name{font-size:14px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:#d9dfdc}h1{margin:0;font-size:clamp(28px,3.1vw,48px);line-height:1.05;letter-spacing:-.04em}.hero-subtitle{margin-top:12px;color:#aeb7b4;font-size:14px}.tabs{display:flex;gap:10px;margin:18px 0 22px}.tab{display:inline-flex;align-items:center;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--text);text-decoration:none;font-size:14px;font-weight:750}.tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.placeholder{padding:34px}.placeholder h2{margin:0 0 10px;font-size:24px}.placeholder p{margin:0;color:var(--muted);line-height:1.6}.footer{margin-top:26px;text-align:center;color:#9aa29f;font-size:12px}@media(max-width:560px){.shell{width:min(100% - 24px,1440px);padding-top:14px}.hero{padding:26px 22px;border-radius:22px}.tabs{flex-direction:column}.tab{justify-content:center}}
  </style>
</head>
<body>
<main class="shell">
  <section class="hero">
    <div class="brand"><div class="brand-mark"></div><div class="brand-name">Агентство Связи</div></div>
    <h1>Общие продажи</h1>
    <div class="hero-subtitle">Отдельная статистика по общим продажам</div>
  </section>
  <nav class="tabs">
    <a class="tab" href="index.html">Дашборд продаж</a>
    <a class="tab active" href="general-sales.html">Общие продажи</a>
    <a class="tab" href="payouts.html">Выплаты за продажу</a>
  </nav>
  <section class="card placeholder">
    <h2>Вкладка создана</h2>
    <p>Наполнение и логику этой вкладки настроим отдельно.</p>
  </section>
  <div class="footer">Агентство Связи · Общие продажи</div>
</main>
</body>
</html>
